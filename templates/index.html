<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div class="app-wrapper">

        <div class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <button id="menu-toggle-btn">☰</button>
                <button id="new-chat-btn">+ New Chat</button>
            </div>
            <div id="chat-list">
                {% for chat_id, title in chats %}
                    <div class="chat-item {{ 'active' if chat_id == active_chat_id else '' }}" data-chat-id="{{ chat_id }}">
                        <span class="chat-title" data-chat-id="{{ chat_id }}">{{ title }}</span>
                        <button class="menu-btn" data-chat-id="{{ chat_id }}"><span class="dot"></span><span class="dot"></span><span class="dot"></span></button>
                    </div>
                {% endfor %}
            </div>
        </div>
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <div class="chat-container">

            <div class="chat-header">
                <div class="header-left">
                    <button id="menu-toggle-btn-mobile">☰</button>
                    <h1>AI Chatbot</h1>
                </div>
                <button id="theme-toggle">🌙 Dark</button>
            </div>

            <div id="chat-box" data-current-chat-id="{{ active_chat_id }}">
                {% if messages %}
                    {% for sender, message, timestamp in messages %}
                        <div class="message {{ 'user-message' if sender == 'user' else 'bot-message' }}" title="{{ timestamp }}">{{ message }}</div>
                    {% endfor %}
                {% else %}
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" style="color: var(--btn-bg);">
                                <ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(60 12 12)"></ellipse>
                                <ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(-60 12 12)"></ellipse>
                                <ellipse cx="12" cy="12" rx="10" ry="4.2"></ellipse>
                                <circle cx="20.5" cy="7" r="1" fill="currentColor" stroke="none"></circle>
                                <circle cx="3.5" cy="17" r="1" fill="currentColor" stroke="none"></circle>
                                <circle cx="16" cy="20" r="1" fill="currentColor" stroke="none"></circle>
                                <text x="12" y="14" text-anchor="middle" font-size="6" font-weight="700" fill="currentColor" stroke="none" font-family="inherit">AI</text>
                            </svg>
                        </div>
                        <h2>Ask anything</h2>
                        <p>💬 Text-based questions only</p>
                        <p>Coding • Concepts • Explanations</p>
                    </div>
                {% endif %}
            </div>

            <div class="input-area">
                <input type="text" id="user-input" placeholder="Type your message...">
                <button id="send-btn">Send</button>
            </div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

    <script>
    function adjustForKeyboard() {
        if (window.visualViewport) {
            const vh = window.visualViewport.height;
            document.querySelector('.app-wrapper').style.height = vh + 'px';
            window.scrollTo(0, 0);
        }
    }
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', adjustForKeyboard);
        window.visualViewport.addEventListener('scroll', adjustForKeyboard);
        adjustForKeyboard();
    }
    </script>

</body>
</html>
